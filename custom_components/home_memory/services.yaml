      required: true
      example: pool
      selector:
        text:
    text:
      required: true
      example: "Pool ist über den Winter außer Betrieb."
      selector:
        text:
          multiline: true

delete:
  fields:
    topic:
      required: true
      example: pool
      selector:
        text:

restore:
  fields:
    topic:
      required: true
      example: pool
      selector:
        text:
