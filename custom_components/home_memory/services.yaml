set:
  fields:
    topic:
      required: true
      example: energie
      selector:
        text:
    content:
      required: true
      example: "PV hängt hinter Zähler 2, die Wärmepumpe läuft über Zähler 1."
      selector:
        text:
          multiline: true
    refs:
      required: false
      example: "sensor.solarnet_pv_leistung"
      selector:
        text:
          multiple: true
    title:
      required: false
      example: Energie
      selector:
        text:

append:
